<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agentic Coding Open Graph image</title>
    <style>
      @font-face {
        font-family: 'Ubuntu Sans Variable';
        font-style: normal;
        font-weight: 100 800;
        src: url('../node_modules/@fontsource-variable/ubuntu-sans/files/ubuntu-sans-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #fefdfb;
        color: #111827;
        font-family: 'Ubuntu Sans Variable', sans-serif;
      }

      .canvas {
        display: flex;
        width: 1200px;
        height: 630px;
        flex-direction: column;
        padding: 56px 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 32px;
        border-bottom: 1px solid #dfe3e2;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 650;
      }

      .mark {
        width: 48px;
        height: 48px;
      }

      .domain {
        color: #697371;
        font-family: ui-monospace, monospace;
        font-size: 16px;
      }

      .content {
        display: grid;
        flex: 1;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 72px;
        align-items: center;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #006c57;
        font-family: ui-monospace, monospace;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 650px;
        margin: 0;
        font-size: 78px;
        font-variation-settings: 'wght' 650;
        letter-spacing: -4px;
        line-height: 1;
      }

      .thesis {
        max-width: 650px;
        margin: 28px 0 0;
        color: #586360;
        font-size: 28px;
        font-weight: 450;
        line-height: 1.35;
      }

      .system {
        overflow: hidden;
        border: 1px solid #dfe3e2;
        border-radius: 14px;
        background: #ffffff;
      }

      .system-title,
      .system-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .system-title {
        padding: 17px 20px;
        border-bottom: 1px solid #dfe3e2;
        color: #697371;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }

      .system-item {
        min-height: 68px;
        padding: 16px 20px;
        border-bottom: 1px solid #dfe3e2;
        font-size: 19px;
        font-weight: 600;
      }

      .system-item:last-child {
        border-bottom: 0;
      }

      .system-index {
        color: #006c57;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }

      .system-owner {
        color: #697371;
        font-size: 14px;
        font-weight: 450;
      }
    </style>
  </head>
  <body>
    <main
      class="canvas"
      aria-label="Agentic Coding social preview"
    >
      <div class="topbar">
        <div class="brand">
          <svg
            class="mark"
            viewBox="0 0 64 64"
            aria-hidden="true"
          >
            <rect
              width="64"
              height="64"
              rx="16"
              fill="#111111"
            />
            <path
              d="M27 18 13 32l14 14"
              fill="none"
              stroke="#f4f6f1"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m37 18 14 14-14 14"
              fill="none"
              stroke="#76c8ad"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="m32 24 8 8-8 8-8-8 8-8Z"
              fill="#ef6047"
            />
          </svg>
          <span>Agentic Coding</span>
        </div>
        <span class="domain">agenticcoding.jesusgraterol.dev</span>
      </div>

      <div class="content">
        <div>
          <p class="eyebrow">A software-development discipline</p>
          <h1>A disciplined way to build software.</h1>
          <p class="thesis">With coding agents.</p>
        </div>

        <div class="system">
          <div class="system-title">
            <span>controlled-execution.system</span>
            <span>01:04</span>
          </div>
          <div class="system-item">
            <span><span class="system-index">01</span>&nbsp;&nbsp;Intent</span>
            <span class="system-owner">Developer</span>
          </div>
          <div class="system-item">
            <span><span class="system-index">02</span>&nbsp;&nbsp;Plan</span>
            <span class="system-owner">Together</span>
          </div>
          <div class="system-item">
            <span><span class="system-index">03</span>&nbsp;&nbsp;Execute</span>
            <span class="system-owner">Agent</span>
          </div>
          <div class="system-item">
            <span><span class="system-index">04</span>&nbsp;&nbsp;Evidence</span>
            <span class="system-owner">Developer</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
